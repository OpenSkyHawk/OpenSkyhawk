; OpenSkyhawk bootloader (#363) — one source, two builds: `bootloader` (CAN) for every node, `bridge`
; (USART2) for the Gateway's PanelBridge (#367). Each serves STM32F103C8 and STM32F103CB alike (it reads
; the flash size at run time). Bare-metal CMSIS, no Arduino / HAL. Lives in the first 4 KB; apps start at
; 0x08001000 (Firmware/shared/stm32.ini). Flash it once per board:
;
;   pio run -d Firmware/Bootloader -t upload             ; a node
;   pio run -d Firmware/Bootloader -e bridge -t upload   ; the Gateway's PanelBridge
;
; or flash bootloader + app together from a production project: pio run -t bootstrap.
[platformio]
default_envs = bootloader

[env:bootloader]
; Frozen (#367): exact platform, toolchain and CMSIS, so the same source always builds the same bytes
; — a newer compiler can move the size by ±100 B, and this image has to fit 4 KB forever. Changing any
; of these is a bootloader change (FirmwarePlan/12 § Freeze).
platform = ststm32@20.0.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/framework-cmsis-stm32f1@4.3.5
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 72000000L
; Hard budget: one 4 KB write-protect block (#364 protects it). The build fails past it.
board_upload.maximum_size = 4096
; Our own startup (src/startup.cpp): a 16-entry vector table and no C runtime init — the stock
; CMSIS startup's 67-entry table and libc init cost ~280 B this image can't spare (#367).
board_build.cmsis.startup_file = none.S
board_build.cmsis.system_file = none.c
build_flags =
    -Os
    -fno-exceptions
    -fno-rtti
    -flto
    -nostartfiles
    -Wl,--gc-sections
    ; the info block (BootProtocol.h INFO_ADDRESS) in the last 16 bytes; code that grows into it
    ; fails the link with an overlap
    -Wl,--section-start=.osh_bootinfo=0x08000FF0
    -Wl,-u,osh_bootloader_info
    -I../Libraries/BootProtocol
    -I../Libraries/FirmwareImage
    -I../Libraries/FirmwareVersion
    -I../Libraries/NodeStatus

upload_protocol = stlink
; Accept any SWD tap ID — the same command works for genuine chips and clones.
upload_flags =
    -c
    set CPUTAPID 0

; The Gateway's PanelBridge (#367): the same bootloader with USART2 (PA2 / PA3, the link to the RP2040)
; instead of CAN — it is the CAN master, so nothing on the bus could update it. Templates/PanelBridge's
; `bootstrap` and the release's gateway -full.hex use this one.
[env:bridge]
extends = env:bootloader
build_flags =
    ${env:bootloader.build_flags}
    -DOSH_BOOT_BRIDGE
