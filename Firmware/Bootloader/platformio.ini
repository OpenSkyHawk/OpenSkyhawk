; OpenSkyhawk CAN bootloader (#363) — one image for every STM32 board (STM32F103C8 and STM32F103CB:
; it reads the flash size at run time). Bare-metal CMSIS, no Arduino / HAL. Lives in the first 4 KB;
; apps start at 0x08001000 (Firmware/shared/stm32.ini). Flash it once per board:
;
;   pio run -d Firmware/Bootloader -t upload
;
; or flash bootloader + app together from a production project: pio run -t bootstrap.
[env:bootloader]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = cmsis
board_build.f_cpu = 72000000L
; Hard budget: one 4 KB write-protect block (#364 protects it). The build fails past it.
board_upload.maximum_size = 4096
build_flags =
    -Os
    -fno-exceptions
    -fno-rtti
    -Wl,--gc-sections
    -I../Libraries/BootProtocol
    -I../Libraries/FirmwareImage
    -I../Libraries/FirmwareVersion
    -I../Libraries/NodeStatus

upload_protocol = stlink
; Accept any SWD tap ID — the same command works for genuine chips and clones.
upload_flags =
    -c
    set CPUTAPID 0
