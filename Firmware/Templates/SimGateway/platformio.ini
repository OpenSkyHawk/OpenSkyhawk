[env:SimGateway]
; Pinned to a commit: a git platform has no version range, so an unpinned URL builds whatever the
; fork's latest code is. Raising it changes the RP2040 core (USB stack, flash layout) — rebuild,
; bench the Gateway, then move every SimGateway env together.
platform =https://github.com/maxgerhardt/platform-raspberrypi.git#79ce473e1a8010ed8096388690222fd2c94858a6
; Change board to match your module: rpipico, rpipico2, waveshare_rp2040_zero, etc.
board = rpipico
board_build.core = earlephilhower
framework = arduino
upload_protocol = picotool
; -DUSE_TINYUSB selects the TinyUSB USB stack (replaces default Pico stack).
; Required for Adafruit_TinyUSB.h and the HID backend in SimGateway.cpp.
build_flags = -DUSE_TINYUSB

; When copied to Firmware/<Name>/, change ../../Libraries → ../Libraries
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    HIDControls
    SimGateway
    adafruit/Adafruit TinyUSB Library@^3.7.7

monitor_speed = 250000
