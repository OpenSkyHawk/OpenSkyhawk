[env:PanelBridge]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
; STM32F103C8 (64 KB) — the MCU on the Gateway board. PanelBridge compiles to ~26 KB, so the C8
; fits comfortably; genericSTM32F103CB (128 KB) is the drop-in fallback if a build ever outgrows it.
board = genericSTM32F103C8
framework = arduino
board_build.f_cpu = 72000000L

; Serial = UART2 (PA2/PA3) → SimGateway @ 250000 baud.
; No USB CDC — USB pins (PA11/PA12) are shared with CAN and used for CAN only.
build_flags =
    -DNODE_ID=0
    -DSERIAL_RX_BUFFER_SIZE=256
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000

; When copied to Firmware/<PanelName>/, change ../../Libraries → ../Libraries
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    HIDControls
    STM32Board
    PanelBridge
    CANProtocol
    A4EC
    dcs-skunkworks/DCS-BIOS@^0.3.10

upload_protocol = stlink
; Some STM32F103 clones require the CPUTAPID override below.
; Uncomment if ST-Link reports "tap not found" during flashing:
; upload_flags =
;     -c
;     set CPUTAPID 0
monitor_speed = 115200

; Production build: the identity block + post-build stamp shared by every released STM32 image (#362).
; When copied to Firmware/<PanelName>/, change ../../shared → ../shared and ${PROJECT_DIR}/../.. → ${PROJECT_DIR}/..
[platformio]
extra_configs = ../../shared/stm32.ini

[osh]
firmware = ${PROJECT_DIR}/../..
; The Gateway's PanelBridge is updated over USART2 by the RP2040, not over CAN (#367).
bootloader_env = bridge
