[env:PanelGroupSample]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
board_build.f_cpu = 72000000L

; NODE_ID must be set here — not in src/main.cpp.
; A #define in main.cpp is invisible to library translation units (CANProtocol, PanelGroup).
build_unflags = -std=gnu++17
build_flags =
    -std=gnu++20                 ; same as Templates/PanelGroup, so DrumDisplay works if you add one
    -DNODE_ID=1                  ; set your own, 1–63, unique on your bus
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000

; -DHSE_VALUE=8000000: explicit 8 MHz external crystal — required for reliable CAN bit-rate
; lock. Internal RC oscillator is not accurate enough for 500 kbps CAN timing.

; Copied to Firmware/Panels/<PanelName>/, these paths stay as they are (same depth under Firmware/).
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
; deep+ required: Adafruit BusIO (pulled by ADS1X15) needs the STM32 SPI/Wire
; framework headers which are not auto-discovered on a fresh libdeps build.
lib_ldf_mode = deep+
lib_deps =
    HIDControls
    STM32Board
    PanelGroup
    CANProtocol
    A4EC
    blemasle/MCP23017@^2.0.0
    adafruit/Adafruit ADS1X15@^2.0.0

upload_protocol = stlink
; Some STM32F103C8 clones require the CPUTAPID override below.
; Uncomment if ST-Link reports "tap not found" during flashing:
; upload_flags =
;     -c
;     set CPUTAPID 0
monitor_speed = 115200
; monitor_port = /dev/cu.usbserial-XXXX   ; set to your USB-serial adapter port

; Production build: the identity block + post-build stamp shared by every released STM32 image (#362).
; Also adds `pio run -t bootstrap` — bootloader + this sketch, once per new board.
[platformio]
extra_configs = ../../shared/stm32.ini

[osh]
firmware = ${PROJECT_DIR}/../..
