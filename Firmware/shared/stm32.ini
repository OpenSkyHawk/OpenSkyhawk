; OpenSkyhawk — settings every production STM32 build shares (#362): Templates, Panels, Examples.
; (Tests stay plain ST-Link builds and don't include this.) A project includes it with
;
;   [platformio]
;   extra_configs = ../../shared/stm32.ini          ; the path from the project to this file
;
;   [osh]
;   firmware = ${PROJECT_DIR}/../..                 ; the same path, to Firmware/
;
; and gets the identity-block linker script, the post-build stamp, the bootloader layout and the
; `bootstrap` target (pio run -t bootstrap: flash the bootloader + this app onto a blank board).
[env]
board_build.ldscript = ${osh.firmware}/shared/stm32f103.ld
extra_scripts = post:${osh.firmware}/shared/osh_image.py

; Bootloader layout (#363): Firmware/Bootloader owns the first 4 KB; apps start after it. An ST-Link
; upload writes the app only and leaves the bootloader in place — a blank board needs `-t bootstrap`
; (or the bootloader flashed once) first.
board_build.flash_offset = 0x1000
board_upload.offset_address = 0x08001000
