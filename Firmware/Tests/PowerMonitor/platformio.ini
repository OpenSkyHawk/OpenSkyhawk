[platformio]
src_dir = tests

; PowerMonitor (PDU node, #216) tests. pdu_math / rail_monitor / board_thermal / telem_schedule are
; pure logic on injected values; cal_store writes the reserved calibration flash page (0x0800FC00)
; and erases it when done. Any STM32F103 board — no PDU hardware needed. Results on DiagSerial
; (USART1 PA9/PA10, 115200).
[env_base]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
build_flags =
    -DNODE_ID=3
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    STM32Board
    CANProtocol
    NodeStatus
    PowerMonitor
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
monitor_speed = 115200

[env:test_pdu_math]
extends = env_base
build_src_filter = -<*> +<pdu_math/pdu_math.cpp>

[env:test_rail_monitor]
extends = env_base
build_src_filter = -<*> +<rail_monitor/rail_monitor.cpp>

[env:test_board_thermal]
extends = env_base
build_src_filter = -<*> +<board_thermal/board_thermal.cpp>

[env:test_telem_schedule]
extends = env_base
build_src_filter = -<*> +<telem_schedule/telem_schedule.cpp>

; Writes and erases the real calibration page — leaves the board uncalibrated.
[env:test_cal_store]
extends = env_base
build_src_filter = -<*> +<cal_store/cal_store.cpp>
