[platformio]
src_dir = tests

[env_base]
; Pinned deliberately: an unpinned platform silently jumped to ststm32 20.0.0
; (STM32 Arduino core 3.0.0) and broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
build_flags =
    -DNODE_ID=1
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    STM32Board
    NodeStatus
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
monitor_speed = 115200

[env:test_aggregate]
extends = env_base
build_src_filter = -<*> +<aggregate/aggregate.cpp>
