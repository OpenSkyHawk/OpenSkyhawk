[platformio]
src_dir = tests

[env_base]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
build_flags =
    -DNODE_ID=1
    -DHAL_CAN_MODULE_ENABLED
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
monitor_speed = 115200
lib_deps =
    file://../../Libraries/PanelGroup
    file://../../Libraries/CANProtocol
    file://../../Libraries/NodeStatus
    file://../../Libraries/STM32Board
    file://../../Libraries/HIDControls
    blemasle/MCP23017@^2.0.0
    adafruit/Adafruit ADS1X15@^2.0.0

; All envs need a PB0→PA0 jumper: PB0 is driven as an output to act as the button, PA0 is the
; ActionButton input. Driving the "button" from software is what makes press, hold and bounce
; timing exact — while the read still goes through PinRef::read(), which a state-injection seam
; would have bypassed.

[env:test_press_edge]
extends = env_base
build_src_filter = -<*> +<press_edge/press_edge.cpp>

[env:test_force_report]
extends = env_base
build_src_filter = -<*> +<force_report/force_report.cpp>

[env:test_debounce]
extends = env_base
build_src_filter = -<*> +<debounce/debounce.cpp>

[env:test_reverse]
extends = env_base
build_src_filter = -<*> +<reverse/reverse.cpp>
