[platformio]
src_dir = tests

[env_base]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
build_flags =
    -DNODE_ID=1
    -DHAL_CAN_MODULE_ENABLED
    -DROTARYENCODER_TEST
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
monitor_speed = 115200
lib_deps =
    file://../../Libraries/PanelGroup
    file://../../Libraries/CANProtocol
    file://../../Libraries/NodeStatus
    file://../../Libraries/STM32Board
    file://../../Libraries/HIDControls
    blemasle/MCP23017@^2.0.0
    adafruit/Adafruit ADS1X15@^2.0.0

[env:test_reverse_blip]
extends = env_base
build_src_filter = -<*> +<reverse_blip/reverse_blip.cpp>

[env:test_momentum_reset]
extends = env_base
build_src_filter = -<*> +<momentum_reset/momentum_reset.cpp>

[env:test_fast_slow]
extends = env_base
build_src_filter = -<*> +<fast_slow/fast_slow.cpp>

[env:test_burst_coalesce]
extends = env_base
build_src_filter = -<*> +<burst_coalesce/burst_coalesce.cpp>

[env:test_dir_filter_only]
extends = env_base
build_src_filter = -<*> +<dir_filter_only/dir_filter_only.cpp>
