[platformio]
src_dir = tests

[env_base]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
build_flags =
    -DNODE_ID=1
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000
lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    STM32Board
    CANProtocol
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
monitor_speed = 115200

[env:test_led_state_machine]
extends = env_base
build_src_filter = -<*> +<led_state_machine/led_state_machine.cpp>

[env:test_diag_serial]
extends = env_base
build_src_filter = -<*> +<diag_serial/diag_serial.cpp>

[env:test_can_status_wiring]
extends = env_base
build_src_filter = -<*> +<can_status_wiring/can_status_wiring.cpp>

; ── Derived-state engine tests (#93) — STM32BOARD_TEST exposes LedState + currentState() ──

[env:test_state_precedence]
extends = env_base
build_flags = ${env_base.build_flags} -DSTM32BOARD_TEST
build_src_filter = -<*> +<state_precedence/state_precedence.cpp>

[env:test_link_decay]
extends = env_base
build_flags = ${env_base.build_flags} -DSTM32BOARD_TEST
build_src_filter = -<*> +<link_decay/link_decay.cpp>

[env:test_warning_clear]
extends = env_base
build_flags = ${env_base.build_flags} -DSTM32BOARD_TEST
build_src_filter = -<*> +<warning_clear/warning_clear.cpp>

[env:test_animation_timing]
extends = env_base
build_flags = ${env_base.build_flags} -DSTM32BOARD_TEST
build_src_filter = -<*> +<animation_timing/animation_timing.cpp>

; ── ADC prescaler (#263) — SystemClock_Config has two exit paths; both must set /6 ──

[env:test_adc_clock]
extends = env_base
build_src_filter = -<*> +<adc_clock/adc_clock.cpp>

[env:test_adc_clock_fallback]
extends = env_base
build_flags = ${env_base.build_flags} -DFORCE_CLOCK_FALLBACK
build_src_filter = -<*> +<adc_clock/adc_clock.cpp>

; ── JTAG release (#299) — begin() frees PA15/PB3/PB4, SWD kept; nothing wired to those pins ──

[env:test_jtag_release]
extends = env_base
build_src_filter = -<*> +<jtag_release/jtag_release.cpp>
