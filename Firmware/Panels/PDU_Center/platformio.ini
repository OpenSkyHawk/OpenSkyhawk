[env:PDU_Center]
; Major version held on purpose: ^20 takes 20.x updates but blocks the next
; major. Unconstrained, this jumped to 20.0.0 (STM32 Arduino core 3.0.0) and
; broke the weekly build for two weeks (#276).
platform = ststm32@^20.0.0
board = genericSTM32F103C8
framework = arduino
board_build.f_cpu = 72000000L

; The last 1 KB flash page (0x0800FC00) holds this board's calibration (PowerMonitor
; PduCalStore). Capping the image at 63 KB makes the build fail before code can grow into it.
board_upload.maximum_size = 64512

; NODE_ID must be set here — not in src/main.cpp.
; A #define in main.cpp is invisible to library translation units (CANProtocol, PowerMonitor).
; The three PDUs run identical code; only NODE_ID differs. Center console PDU = 5 (Firmware/NODE_IDS.md).
build_flags =
    -DNODE_ID=5
    -DHAL_CAN_MODULE_ENABLED
    -DUSB_NONE
    -DHSE_VALUE=8000000

lib_extra_dirs = ${PROJECT_DIR}/../../Libraries
lib_deps =
    STM32Board
    CANProtocol
    NodeStatus
    PowerMonitor

upload_protocol = stlink
monitor_speed = 115200

; Production build: the identity block + post-build stamp shared by every released STM32 image (#362).
[platformio]
extra_configs = ../../shared/stm32.ini

[osh]
firmware = ${PROJECT_DIR}/../..
