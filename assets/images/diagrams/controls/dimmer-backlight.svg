<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>A 12 V backlight string of five LEDs and a 120 ohm resistor plugged into backlight connector J_BL1</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .wi    { fill:none; stroke-width:1.6; stroke-dasharray:4 3; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .v12 { stroke:#f59e0b; } .t12 { fill:#f59e0b; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .res { fill:#1e293b; stroke:#c7d0e0; stroke-width:2; }
    .led { fill:#f87171; stroke:#e8ecf4; stroke-width:1.5; stroke-linejoin:round; }
    .bar { stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .ray { stroke:#fca5a5; stroke-width:1.6; stroke-linecap:round; fill:none; }
    .rayh { fill:#fca5a5; }
    .box { fill:none; stroke:#9ca8bc; stroke-width:1.6; stroke-dasharray:4 3; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="248" rx="12"/>

  <!-- board, with its built-in MOSFET drawn dashed -->
  <rect class="board" x="24" y="40" width="176" height="160" rx="6"/>
  <text class="title" x="112" y="30" text-anchor="middle">PanelGroup board</text>
  <text class="note"  x="38" y="62">J_BL1</text>
  <text class="pin t12"  x="182" y="85"  text-anchor="end">+12V</text>
  <text class="note"     x="182" y="100" text-anchor="end">pin 1</text>
  <text class="pin tsig" x="182" y="165" text-anchor="end">RETURN</text>
  <text class="note"     x="182" y="190" text-anchor="end">pin 2</text>
  <circle class="pad v12" cx="200" cy="80"  r="7"/>
  <circle class="pad sig" cx="200" cy="170" r="7"/>
  <rect class="box" x="38" y="122" width="84" height="30" rx="3"/>
  <text class="note" x="80" y="141" text-anchor="middle">MOSFET</text>
  <polyline class="wi sig" points="80,152 80,170 193,170"/>
  <text class="note" x="38" y="114">switched by PA6</text>

  <!-- +12V → resistor → five LEDs in series -->
  <line class="w v12" x1="207" y1="80" x2="236" y2="80"/>
  <rect class="res" x="236" y="71" width="40" height="18" rx="3"/>
  <text class="label" x="256" y="62" text-anchor="middle">120 Ω</text>
  <line class="w v12" x1="276" y1="80" x2="300" y2="80"/>

  <!-- five LEDs pointing right -->
  <polygon class="led" points="300,68 300,92 320,80"/><line class="bar" x1="321" y1="68" x2="321" y2="92"/>
  <line class="w sig" x1="321" y1="80" x2="345" y2="80"/>
  <polygon class="led" points="345,68 345,92 365,80"/><line class="bar" x1="366" y1="68" x2="366" y2="92"/>
  <line class="w sig" x1="366" y1="80" x2="390" y2="80"/>
  <polygon class="led" points="390,68 390,92 410,80"/><line class="bar" x1="411" y1="68" x2="411" y2="92"/>
  <line class="w sig" x1="411" y1="80" x2="435" y2="80"/>
  <polygon class="led" points="435,68 435,92 455,80"/><line class="bar" x1="456" y1="68" x2="456" y2="92"/>
  <line class="w sig" x1="456" y1="80" x2="480" y2="80"/>
  <polygon class="led" points="480,68 480,92 500,80"/><line class="bar" x1="501" y1="68" x2="501" y2="92"/>
  <text class="label" x="400" y="118" text-anchor="middle">5 red LEDs in a row</text>

  <!-- back to the return pin -->
  <polyline class="w sig" points="501,80 540,80 540,170 207,170"/>

  <text class="note" x="300" y="228" text-anchor="middle">The board pulses the return line — the longer each pulse, the brighter the string</text>
</svg>
