<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>Switch3Pos wired to inputs D0 and D1 of the first shift-register chip</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .wi    { fill:none; stroke-width:1.6; stroke-dasharray:4 3; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .resi { fill:none; stroke:#9ca8bc; stroke-width:1.6; stroke-dasharray:4 3; }
    .sw  { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="268" rx="12"/>

  <!-- shift-register board, with its built-in pull-ups drawn dashed -->
  <rect class="board" x="24" y="40" width="216" height="190" rx="6"/>
  <text class="title" x="132" y="30" text-anchor="middle">Shift-register board</text>
  <text class="note"  x="38" y="220">first 74HC165 chip · cable to J_SR</text>
  <text class="pin t33" x="40" y="66" style="font-size:11px">3.3V</text>
  <polyline class="wi v33" points="76,62 180,62"/>
  <!-- D0 pull-up -->
  <line class="wi v33" x1="180" y1="62" x2="180" y2="70"/>
  <rect class="resi" x="172" y="70" width="16" height="22" rx="2"/>
  <polyline class="wi sig" points="180,92 180,110 222,110"/>
  <!-- D1 pull-up -->
  <line class="wi v33" x1="110" y1="62" x2="110" y2="70"/>
  <rect class="resi" x="102" y="70" width="16" height="22" rx="2"/>
  <polyline class="wi sig" points="110,92 110,155 222,155"/>
  <text class="note" x="124" y="84">10 kΩ</text>
  <text class="note" x="124" y="98">built in</text>

  <text class="pin tsig" x="222" y="104" text-anchor="end">D0</text>
  <text class="pin tsig" x="222" y="149" text-anchor="end">D1</text>
  <text class="pin tgnd" x="222" y="194" text-anchor="end">GND</text>
  <circle class="pad sig" cx="240" cy="110" r="7"/>
  <circle class="pad sig" cx="240" cy="155" r="7"/>
  <circle class="pad gnd" cx="240" cy="200" r="7"/>

  <!-- D0 → leg A, D1 → leg B -->
  <line class="w sig" x1="247" y1="110" x2="470" y2="110"/>
  <line class="w sig" x1="247" y1="155" x2="470" y2="155"/>

  <!-- toggle: legs A and B, middle leg (common) -->
  <circle class="swc" cx="474" cy="110" r="4"/>
  <circle class="swc" cx="474" cy="155" r="4"/>
  <circle class="swc" cx="530" cy="132" r="4"/>
  <line class="sw" x1="526" y1="132" x2="492" y2="132"/>
  <text class="label" x="474" y="99"  text-anchor="middle">A</text>
  <text class="label" x="474" y="176" text-anchor="middle">B</text>
  <text class="label" x="512" y="84" text-anchor="middle">toggle</text>
  <text class="note"  x="530" y="152" text-anchor="middle">middle leg</text>

  <!-- middle leg → GND -->
  <polyline class="w gnd" points="534,132 570,132 570,200 247,200"/>

  <text class="note" x="300" y="252" text-anchor="middle">Only three wires — the pull-up resistors are already on the board</text>
</svg>
