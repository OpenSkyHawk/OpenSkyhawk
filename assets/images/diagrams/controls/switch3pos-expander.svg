<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>Switch3Pos wired to pins GPA0 and GPA1 on a digital expander</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .res { fill:#1e293b; stroke:#c7d0e0; stroke-width:2; }
    .dot { fill:#7db4f5; }
    .sw  { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="268" rx="12"/>

  <!-- expander -->
  <rect class="board" x="24" y="40" width="176" height="190" rx="6"/>
  <text class="title" x="112" y="30" text-anchor="middle">Digital expander</text>
  <text class="note"  x="38" y="220">MCP23017 · cable to J_I2C1</text>
  <text class="pin t33"  x="182" y="70"  text-anchor="end">3.3V</text>
  <text class="pin tsig" x="182" y="115" text-anchor="end">GPA0</text>
  <text class="pin tsig" x="182" y="160" text-anchor="end">GPA1</text>
  <text class="pin tgnd" x="182" y="205" text-anchor="end">GND</text>
  <circle class="pad v33" cx="200" cy="65"  r="7"/>
  <circle class="pad sig" cx="200" cy="110" r="7"/>
  <circle class="pad sig" cx="200" cy="155" r="7"/>
  <circle class="pad gnd" cx="200" cy="200" r="7"/>

  <!-- 3.3V rail → two pull-up resistors -->
  <polyline class="w v33" points="207,65 360,65"/>
  <line class="w v33" x1="300" y1="65" x2="300" y2="71"/>
  <rect class="res" x="290" y="71" width="20" height="24" rx="3"/>
  <line class="w sig" x1="300" y1="95" x2="300" y2="110"/>
  <line class="w v33" x1="360" y1="65" x2="360" y2="71"/>
  <rect class="res" x="350" y="71" width="20" height="24" rx="3"/>
  <line class="w sig" x1="360" y1="95" x2="360" y2="155"/>
  <text class="label" x="380" y="87">10 kΩ each</text>
  <text class="note"  x="380" y="101">two pull-ups</text>

  <!-- GPA0 → leg A (hops over GPA1's pull-up wire) -->
  <path class="w sig" d="M207,110 H354 a6,6 0 0 1 12,0 H470"/>
  <circle class="dot" cx="300" cy="110" r="4.5"/>

  <!-- GPA1 → leg B -->
  <line class="w sig" x1="207" y1="155" x2="470" y2="155"/>
  <circle class="dot" cx="360" cy="155" r="4.5"/>

  <!-- toggle: legs A and B, middle leg (common) -->
  <circle class="swc" cx="474" cy="110" r="4"/>
  <circle class="swc" cx="474" cy="155" r="4"/>
  <circle class="swc" cx="530" cy="132" r="4"/>
  <line class="sw" x1="526" y1="132" x2="492" y2="132"/>
  <text class="label" x="474" y="99"  text-anchor="middle">A</text>
  <text class="label" x="474" y="176" text-anchor="middle">B</text>
  <text class="label" x="512" y="84" text-anchor="middle">toggle</text>
  <text class="note"  x="530" y="152" text-anchor="middle">middle leg</text>

  <!-- middle leg → GND -->
  <polyline class="w gnd" points="534,132 570,132 570,200 207,200"/>

  <text class="note" x="300" y="252" text-anchor="middle">Same wiring as on the board, just on the expander's pins</text>
</svg>
