<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>ActionButton: a push-button wired to input D0 of the first shift-register chip</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .wi    { fill:none; stroke-width:1.6; stroke-dasharray:4 3; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .resi { fill:none; stroke:#9ca8bc; stroke-width:1.6; stroke-dasharray:4 3; }
    .sw  { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="248" rx="12"/>

  <!-- shift-register board, with its built-in pull-up drawn dashed -->
  <rect class="board" x="24" y="40" width="216" height="160" rx="6"/>
  <text class="title" x="132" y="30" text-anchor="middle">Shift-register board</text>
  <text class="note"  x="38" y="190">first 74HC165 chip · cable to J_SR</text>
  <polyline class="wi v33" points="76,62 110,62 110,74"/>
  <text class="pin t33" x="40" y="66" style="font-size:11px">3.3V</text>
  <rect class="resi" x="102" y="74" width="16" height="24" rx="2"/>
  <polyline class="wi sig" points="110,98 110,120 222,120"/>
  <text class="note" x="126" y="86">10 kΩ</text>
  <text class="note" x="126" y="100">built in</text>
  <text class="pin tsig" x="222" y="112" text-anchor="end">D0</text>
  <text class="pin tgnd" x="222" y="162" text-anchor="end">GND</text>
  <circle class="pad sig" cx="240" cy="120" r="7"/>
  <circle class="pad gnd" cx="240" cy="170" r="7"/>

  <!-- D0 → push-button -->
  <line class="w sig" x1="247" y1="120" x2="500" y2="120"/>

  <!-- push-button, D0 to GND -->
  <line class="w sig" x1="500" y1="120" x2="500" y2="132"/>
  <circle class="swc" cx="500" cy="136" r="4"/>
  <circle class="swc" cx="500" cy="164" r="4"/>
  <line class="sw" x1="511" y1="130" x2="511" y2="170"/>
  <line class="sw" x1="511" y1="150" x2="525" y2="150"/>
  <line class="sw" x1="525" y1="142" x2="525" y2="158"/>
  <line class="w gnd" x1="500" y1="168" x2="500" y2="170"/>
  <text class="label" x="535" y="146">push-</text>
  <text class="label" x="535" y="161">button</text>

  <!-- GND return -->
  <line class="w gnd" x1="500" y1="170" x2="247" y2="170"/>

  <text class="note" x="300" y="228" text-anchor="middle">Only two wires — the pull-up resistor is already on the board</text>
</svg>
