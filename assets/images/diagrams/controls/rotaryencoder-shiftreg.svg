<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>RotaryEncoder wired to inputs D0 and D1 of the first shift-register chip</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .wi    { fill:none; stroke-width:1.6; stroke-dasharray:4 3; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .resi { fill:none; stroke:#9ca8bc; stroke-width:1.6; stroke-dasharray:4 3; }
    .enc  { fill:#111827; stroke:#e8ecf4; stroke-width:2; }
    .knob { fill:#1e293b; stroke:#e8ecf4; stroke-width:2; }
    .tick { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc  { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
    .epin { font-size:13px; font-weight:700; fill:#e8ecf4; font-family:"SF Mono",Consolas,monospace; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="288" rx="12"/>

  <!-- shift-register board, with its built-in pull-ups drawn dashed -->
  <rect class="board" x="24" y="40" width="216" height="210" rx="6"/>
  <text class="title" x="132" y="30" text-anchor="middle">Shift-register board</text>
  <text class="note"  x="38" y="240">first 74HC165 chip · cable to J_SR</text>

  <text class="pin t33" x="40" y="124" style="font-size:11px">3.3V</text>
  <polyline class="wi v33" points="76,120 160,120"/>
  <!-- built-in pull-up to D0 -->
  <polyline class="wi v33" points="110,120 110,110"/>
  <rect class="resi" x="102" y="86" width="16" height="24" rx="2"/>
  <polyline class="wi sig" points="110,86 110,70 222,70"/>
  <!-- built-in pull-up to D1 -->
  <polyline class="wi v33" points="160,120 160,130"/>
  <rect class="resi" x="152" y="130" width="16" height="24" rx="2"/>
  <polyline class="wi sig" points="160,154 160,170 222,170"/>
  <text class="note" x="126" y="96">10 kΩ</text>
  <text class="note" x="126" y="108">built in</text>

  <text class="pin tsig" x="222" y="62"  text-anchor="end">D0</text>
  <text class="pin tsig" x="222" y="162" text-anchor="end">D1</text>
  <text class="pin tgnd" x="222" y="207" text-anchor="end">GND</text>
  <circle class="pad sig" cx="240" cy="70"  r="7"/>
  <circle class="pad sig" cx="240" cy="170" r="7"/>
  <circle class="pad gnd" cx="240" cy="215" r="7"/>

  <!-- D0 → A, D1 → B -->
  <line class="w sig" x1="247" y1="70"  x2="446" y2="70"/>
  <line class="w sig" x1="247" y1="170" x2="446" y2="170"/>

  <!-- encoder -->
  <text class="title" x="510" y="40" text-anchor="middle">Rotary encoder</text>
  <rect class="enc" x="450" y="50" width="120" height="140" rx="8"/>
  <circle class="knob" cx="518" cy="120" r="28"/>
  <line class="tick" x1="518" y1="120" x2="518" y2="98"/>
  <circle class="swc" cx="450" cy="70"  r="4"/>
  <circle class="swc" cx="450" cy="170" r="4"/>
  <circle class="swc" cx="510" cy="190" r="4"/>
  <text class="epin" x="462" y="75">A</text>
  <text class="epin" x="462" y="175">B</text>
  <text class="epin" x="510" y="180" text-anchor="middle">C</text>

  <!-- GND → C -->
  <polyline class="w gnd" points="247,215 510,215 510,194"/>

  <text class="note" x="300" y="274" text-anchor="middle">Just three wires — the pull-up resistors are already on the board</text>
</svg>
