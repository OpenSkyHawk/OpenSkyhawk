<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>SwitchMultiPos: a 4-position selector wired to inputs D0 to D3 of the first shift-register chip</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .wi    { fill:none; stroke-width:1.6; stroke-dasharray:4 3; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .resi { fill:none; stroke:#9ca8bc; stroke-width:1.6; stroke-dasharray:4 3; }
    .sw  { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="318" rx="12"/>

  <!-- shift-register board, with its built-in pull-ups drawn dashed -->
  <rect class="board" x="24" y="40" width="216" height="248" rx="6"/>
  <text class="title" x="132" y="30" text-anchor="middle">Shift-register board</text>
  <text class="note"  x="38" y="278">first 74HC165 chip · cable to J_SR</text>
  <text class="pin t33" x="40" y="62" style="font-size:11px">3.3V</text>
  <polyline class="wi v33" points="76,58 196,58"/>
  <line class="wi v33" x1="196" y1="58" x2="196" y2="64"/>
  <line class="wi v33" x1="160" y1="58" x2="160" y2="64"/>
  <line class="wi v33" x1="124" y1="58" x2="124" y2="64"/>
  <line class="wi v33" x1="88"  y1="58" x2="88"  y2="64"/>
  <rect class="resi" x="189" y="64" width="14" height="20" rx="2"/>
  <rect class="resi" x="153" y="64" width="14" height="20" rx="2"/>
  <rect class="resi" x="117" y="64" width="14" height="20" rx="2"/>
  <rect class="resi" x="81"  y="64" width="14" height="20" rx="2"/>
  <polyline class="wi sig" points="196,84 196,105 222,105"/>
  <polyline class="wi sig" points="160,84 160,145 222,145"/>
  <polyline class="wi sig" points="124,84 124,185 222,185"/>
  <polyline class="wi sig" points="88,84 88,225 222,225"/>
  <text class="note" x="40" y="252">10 kΩ pull-ups built in</text>

  <text class="pin tsig" x="222" y="99"  text-anchor="end">D0</text>
  <text class="pin tsig" x="222" y="139" text-anchor="end">D1</text>
  <text class="pin tsig" x="222" y="179" text-anchor="end">D2</text>
  <text class="pin tsig" x="222" y="219" text-anchor="end">D3</text>
  <text class="pin tgnd" x="222" y="262" text-anchor="end">GND</text>
  <circle class="pad sig" cx="240" cy="105" r="7"/>
  <circle class="pad sig" cx="240" cy="145" r="7"/>
  <circle class="pad sig" cx="240" cy="185" r="7"/>
  <circle class="pad sig" cx="240" cy="225" r="7"/>
  <circle class="pad gnd" cx="240" cy="268" r="7"/>

  <!-- inputs → the selector's position legs -->
  <line class="w sig" x1="247" y1="105" x2="494" y2="105"/>
  <line class="w sig" x1="247" y1="145" x2="494" y2="145"/>
  <line class="w sig" x1="247" y1="185" x2="494" y2="185"/>
  <line class="w sig" x1="247" y1="225" x2="494" y2="225"/>

  <!-- selector: four position legs and the common leg -->
  <circle class="swc" cx="498" cy="105" r="4"/>
  <circle class="swc" cx="498" cy="145" r="4"/>
  <circle class="swc" cx="498" cy="185" r="4"/>
  <circle class="swc" cx="498" cy="225" r="4"/>
  <text class="label" x="486" y="97"  text-anchor="end">0</text>
  <text class="label" x="486" y="137" text-anchor="end">1</text>
  <text class="label" x="486" y="177" text-anchor="end">2</text>
  <text class="label" x="486" y="217" text-anchor="end">3</text>
  <circle class="swc" cx="550" cy="165" r="5"/>
  <line class="sw" x1="546" y1="162" x2="503" y2="147"/>
  <text class="note"  x="550" y="187" text-anchor="middle">common</text>
  <text class="label" x="528" y="252" text-anchor="middle">rotary selector</text>

  <!-- common → GND -->
  <polyline class="w gnd" points="555,165 578,165 578,268 247,268"/>

  <text class="note" x="300" y="304" text-anchor="middle">No resistors to add — the shift-register board already has them</text>
</svg>
