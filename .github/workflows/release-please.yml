name: Release

# Firmware and hardware release tracks (design decision D10). On every push to
# main, release-please keeps one draft release PR per track up to date:
#   firmware — commits under Firmware/: the next version, Firmware/CHANGELOG.md,
#              and every Libraries/*/library.json bumped together;
#   hardware — commits under PCB/: the next version, PCB/CHANGELOG.md, and
#              `release:` in PCB/manifest.yaml.
# Merging a release PR tags firmware-vX.Y.Z / hardware-vX.Y.Z and publishes the
# GitHub Release. A follow-up job then adds what release-please can't know: the
# third-party versions a firmware release resolved, or the boards a hardware
# release contains.
#
# The token is a fine-grained PAT (RELEASE_PLEASE_TOKEN), not GITHUB_TOKEN: a
# PR opened with GITHUB_TOKEN never triggers pull_request workflows, so the
# release PR would never get its required checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    outputs:
      firmware_released: ${{ steps.release.outputs['Firmware--release_created'] }}
      firmware_tag: ${{ steps.release.outputs['Firmware--tag_name'] }}
      hardware_released: ${{ steps.release.outputs['PCB--release_created'] }}
      hardware_tag: ${{ steps.release.outputs['PCB--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  firmware-dependencies:
    # Third-party versions are declared as ranges (^2.0.0, >=3.0.0), so
    # record what a release actually resolved to rather than pinning them.
    name: Record third-party versions
    needs: release-please
    if: needs.release-please.outputs.firmware_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.firmware_tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Resolve and list packages
        run: |
          set -euo pipefail
          # The three templates cover every board's dependencies;
          # Tests/DrumDisplay adds U8g2, which no template uses.
          projects=(
            Firmware/Templates/SimGateway
            Firmware/Templates/PanelBridge
            Firmware/Templates/PanelGroup
            Firmware/Tests/DrumDisplay
          )
          out="$RUNNER_TEMP/dependencies.txt"
          echo "Third-party versions resolved for $TAG" > "$out"
          for project in "${projects[@]}"; do
            platformio pkg install -d "$project" > /dev/null
            {
              echo
              echo "=== $project"
              platformio pkg list -d "$project"
            } >> "$out"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/dependencies.txt" --clobber

  hardware-boards:
    # release-please's changelog lists every PCB/ commit; this adds which
    # boards the release contains, at which version, and what changed in each
    # (from PCB/manifest.yaml).
    name: Add the boards to the release notes
    needs: release-please
    if: needs.release-please.outputs.hardware_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.hardware_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the full history and every tag

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install git-cliff and PyYAML
        run: python -m pip install "git-cliff==2.14.2" "pyyaml>=6"

      - name: Append the board notes
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          gh release view "$TAG" --json body -q .body > "$body"
          { echo; python tools/hardware-release/release_notes.py "$TAG"; } >> "$body"
          gh release edit "$TAG" --notes-file "$body"

      - name: Keep Latest on firmware
        # release-please marks every new release Latest; the badge belongs to
        # the newest firmware release.
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^firmware-v' | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then
            gh release edit "$latest" --latest
          fi
