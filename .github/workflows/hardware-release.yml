name: Hardware Release

# Hardware release track (design decision D10; the standard is the "Releases"
# section of docs/_source/hardware-standards.md). Pushing a board tag
# (pcb/<Board>-vX.Y.Z) or a cockpit tag (hardware-vX.Y.Z) publishes a GitHub
# Release; tools/hardware-release/release_notes.py writes its notes, with
# git-cliff (cliff.toml) listing the commits.
#
# -v0.0.0 tags are baselines that changelogs count from; they get no Release.
# Releases are created with --latest=false so "Latest" stays on firmware.
# Run the workflow by hand for a dry run: it previews the notes for a tag that
# doesn't exist yet in the job summary and publishes nothing.

on:
  push:
    tags:
      - "pcb/**"
      - "hardware-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to preview, e.g. pcb/PanelGroup_Base-v0.2.0 or hardware-v0.1.0 — nothing is published"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Hardware release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the full history and every tag

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install git-cliff and PyYAML
        run: python -m pip install "git-cliff==2.14.2" "pyyaml>=6"

      - name: Write the notes
        id: notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          args=("$TAG" --notes "$notes")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          title="$(python tools/hardware-release/release_notes.py "${args[@]}")"
          if [ -z "$title" ]; then
            echo "$TAG is a baseline tag: no release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "# $title"; echo; cat "$notes"; } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "publish=$([ "$DRY_RUN" = "true" ] && echo false || echo true)"
            echo "title=$title"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.notes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: gh release create "$TAG" --verify-tag --latest=false --title "$TITLE" --notes-file "$NOTES"
