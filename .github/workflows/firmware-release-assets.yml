name: Firmware release assets

# Builds the stock firmware images and packages them for a firmware release (#360):
#   - flat files for the client: manifest.json, one .bin per STM32 board, the Gateway .uf2;
#   - one zip for people: a folder per board with its README; for STM32 the app .elf (the flash
#     address is built in) and <board>-<v>-full.hex (bootloader + app, for a blank board, #363);
#     the Gateway .uf2 (which carries the cockpit side's app, so it can update it, #367); plus the
#     top README, CHANGES, LICENSE and manifest.json.
# The bootloader has two builds from one source (#367): the CAN one for the nodes and the USART2 one
# for the Gateway's cockpit side; each board's -full.hex holds its own. On their own
# (bootloader/bootloader-<v>.elf, bootloader/bootloader-bridge-<v>.elf) they ship only in a release
# where they changed; manifest.json's "bootloader" names the release that holds the current ones.
#
# Called, never triggered directly — it only builds (read-only), recording the flash/RAM size of
# every board in the job summary and uploading the package as an Actions artifact
# (firmware-release-<version>):
#   - release-please.yml, with the release tag, once a firmware release exists; its own
#     firmware-assets-publish job then attaches the artifact to the release;
#   - firmware-release-assets-check.yml, with no tag, to validate pull requests.
# Publishing lives with the caller so this workflow never asks for write access — a nested job
# asking for more than the caller grants fails the whole run at startup, even when skipped.
# It always builds the caller's own commit and never checks out a passed-in ref.

on:
  workflow_call:
    inputs:
      tag:
        description: >-
          The release tag, e.g. firmware-v0.2.0. Names the files and the release to attach them to;
          it is never checked out — the build checks that it points at the commit being built.
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: The version the package is named for; the artifact is firmware-release-<version>
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The caller's own commit, never a passed-in ref. On the release path that is the push that
      # merged the release PR, which is exactly the commit release-please tags.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags: the bootloader ships only in the release where it last changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Work out the version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          # The release tag from release-please, else the ref this run was started on.
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            # Refuse to package anything but the tagged commit under the release's name.
            git fetch --quiet --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
            built="$(git rev-parse HEAD)"
            if [[ "$tagged" != "$built" ]]; then
              echo "::error::$RELEASE_TAG points at $tagged, but this run built $built"
              exit 1
            fi
          fi
          if [[ "$REF" == firmware-v* ]]; then
            echo "version=${REF#firmware-v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The boards a release ships, one per line:
          #   project | env | folder | file base | node | title
          # node is the NODE_ID; "usb" marks the Gateway's RP2040 half.
          boards=(
            "Firmware/Templates/SimGateway|SimGateway|gateway|gateway|usb|Gateway (USB side)"
            "Firmware/Templates/PanelBridge|PanelBridge|gateway|gateway-bridge|0|Gateway (cockpit side)"
            "Firmware/Panels/PDU_Left|PDU_Left|pdu-left|pdu-left|3|PDU Left"
            "Firmware/Panels/PDU_Right|PDU_Right|pdu-right|pdu-right|4|PDU Right"
            "Firmware/Panels/PDU_Center|PDU_Center|pdu-center|pdu-center|5|PDU Center"
          )

          # The bootloader (#363), both builds (#367): `bootloader` (CAN) for the nodes, `bridge`
          # (USART2) for the Gateway's cockpit side. Every STM32 board's -full.hex includes its own.
          # Its frozen toolchain (Firmware/Bootloader/platformio.ini) — the apps use a newer one.
          bl_tools="$HOME/.platformio/packages/toolchain-gccarmnoneeabi@1.70201.0/bin"
          [[ -d "$bl_tools" ]] || bl_tools="$HOME/.platformio/packages/toolchain-gccarmnoneeabi/bin"
          objcopy="$bl_tools/arm-none-eabi-objcopy"
          for bl_env in bootloader bridge; do
            platformio run -d Firmware/Bootloader -e "$bl_env"
            "$objcopy" -O ihex "Firmware/Bootloader/.pio/build/$bl_env/firmware.elf" "$RUNNER_TEMP/$bl_env.hex"
          done

          # The release that holds the current bootloader: the first firmware-v* tag containing the
          # last change to its sources. None yet (or this one) → this release ships it on its own.
          # library.json files are left out: release-please rewrites their versions every release.
          bl_sources=(Firmware/Bootloader/src Firmware/Bootloader/platformio.ini
                      Firmware/Libraries/BootProtocol/BootProtocol.h Firmware/Libraries/FirmwareImage/FirmwareImage.h)
          bl_last="$(git log -1 --format=%H -- "${bl_sources[@]}")"
          bl_holder="$(git tag --contains "$bl_last" --list 'firmware-v*' --sort=v:refname | head -1)"
          bl_ship=0
          if [[ -z "$bl_holder" || "$bl_holder" == "$TAG" ]]; then bl_ship=1; bl_holder="$TAG"; fi
          bl_protocol="$(sed -n -E 's/.*PROTOCOL_VERSION = ([0-9]+);.*/\1/p' Firmware/Libraries/BootProtocol/BootProtocol.h)"

          # full_hex app.elf out.hex bootloader.hex — bootloader + app in one Intel HEX file. The
          # bootloader's end-of-file and start-address records are dropped; the app's close the file.
          full_hex() {
            "$objcopy" -O ihex "$1" "$RUNNER_TEMP/app.hex"
            { grep -v -E '^:(00000001FF|04000005)' "$3"; cat "$RUNNER_TEMP/app.hex"; } > "$2"
          }

          pkg="openskyhawk-firmware-$VERSION"
          dist="$RUNNER_TEMP/dist"            # flat release files
          zipdir="$RUNNER_TEMP/zip/$pkg"      # the zip's contents
          mkdir -p "$dist" "$zipdir"
          entries="$RUNNER_TEMP/manifest-entries.jsonl"
          : > "$entries"

          {
            echo "## Firmware $VERSION — flash and RAM"
            echo
            echo "| Board | Flash | RAM |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # usage "Flash" log → "31348 / 65536 B (47.8%)"
          usage() {
            sed -n -E "s/^$1: *\[[^]]*\] *([0-9.]+)% \(used ([0-9]+) bytes from ([0-9]+) bytes\).*/\2 \/ \3 B (\1%)/p" "$2" | tail -1
          }

          # The bootloaders' real footprint: PlatformIO's "Flash used" leaves out the vector table, so
          # add up what the .elf puts in flash — vectors, code, the .data load copy, the info block.
          bl_footprint() {
            "$bl_tools/arm-none-eabi-size" -A "$1" | awk '
              $1 == ".isr_vector" || $1 == ".text" || $1 == ".rodata" || $1 == ".data" || $1 == ".osh_bootinfo" { n += $2 }
              END { printf "%d / 4096 B (%d B free)", n, 4096 - n }'
          }
          echo "| Bootloader, CAN (nodes) | $(bl_footprint Firmware/Bootloader/.pio/build/bootloader/firmware.elf) | — |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bootloader, USART2 (Gateway cockpit side) | $(bl_footprint Firmware/Bootloader/.pio/build/bridge/firmware.elf) | — |" >> "$GITHUB_STEP_SUMMARY"

          # add_entry file folder node format → one manifest line (node: a NODE_ID, "usb" for the
          # Gateway's RP2040 half, "-" for none)
          add_entry() {
            jq -cn --arg name "$(basename "$1")" --arg board "$2" --arg node "$3" --arg format "$4" \
              --argjson size "$(stat -c %s "$1")" --arg sha256 "$(sha256sum "$1" | cut -d' ' -f1)" \
              '{name: $name, board: $board, format: $format, size: $size, sha256: $sha256}
               + (if $node == "usb" then {side: "usb"} elif $node == "-" then {} else {nodeId: ($node | tonumber)} end)' \
              >> "$entries"
          }

          for line in "${boards[@]}"; do
            IFS='|' read -r project env folder base node title <<< "$line"
            log="$RUNNER_TEMP/$env.log"
            platformio run -d "$project" -e "$env" | tee "$log"
            out="$project/.pio/build/$env"
            echo "| $title | $(usage Flash "$log") | $(usage RAM "$log") |" >> "$GITHUB_STEP_SUMMARY"

            mkdir -p "$zipdir/$folder"
            if [[ "$node" == "usb" ]]; then
              cp "$out/firmware.uf2" "$dist/$base-$VERSION.uf2"
              cp "$out/firmware.uf2" "$zipdir/$folder/$base-$VERSION.uf2"
              add_entry "$dist/$base-$VERSION.uf2" "$folder" "$node" uf2
            else
              cp "$out/firmware.bin" "$dist/$base-$VERSION.bin"
              cp "$out/firmware.elf" "$zipdir/$folder/$base-$VERSION.elf"
              bl_hex="$RUNNER_TEMP/bootloader.hex"
              [[ "$node" == 0 ]] && bl_hex="$RUNNER_TEMP/bridge.hex"   # the cockpit side: USART2 (#367)
              full_hex "$out/firmware.elf" "$zipdir/$folder/$base-$VERSION-full.hex" "$bl_hex"
              add_entry "$dist/$base-$VERSION.bin" "$folder" "$node" bin
              add_entry "$zipdir/$folder/$base-$VERSION.elf" "$folder" "$node" elf
              add_entry "$zipdir/$folder/$base-$VERSION-full.hex" "$folder" "$node" hex
            fi
          done

          if [[ "$bl_ship" == 1 ]]; then
            mkdir -p "$zipdir/bootloader"
            cp Firmware/Bootloader/.pio/build/bootloader/firmware.elf "$zipdir/bootloader/bootloader-$VERSION.elf"
            cp Firmware/Bootloader/.pio/build/bridge/firmware.elf "$zipdir/bootloader/bootloader-bridge-$VERSION.elf"
            add_entry "$zipdir/bootloader/bootloader-$VERSION.elf" bootloader - elf
            add_entry "$zipdir/bootloader/bootloader-bridge-$VERSION.elf" bootloader 0 elf
            BOOTLOADER_NOTE="\`bootloader/\` holds the bootloader on its own, because it changed in this release: \`bootloader-$VERSION.elf\` for the nodes, \`bootloader-bridge-$VERSION.elf\` for the Gateway's cockpit side. You only need them to replace a board's bootloader — the \`-full.hex\` files already include the right one."
          else
            BOOTLOADER_NOTE="The bootloader didn't change in this release; the \`-full.hex\` files include it. On its own (both builds) it is in release $bl_holder."
          fi

          jq -s --arg version "$VERSION" --arg tag "$TAG" --arg bl_tag "$bl_holder" --argjson bl_protocol "$bl_protocol" \
            '{schema: 1, version: $version, tag: $tag, bootloader: {protocol: $bl_protocol, tag: $bl_tag}, files: .}' \
            "$entries" > "$dist/manifest.json"
          cp "$dist/manifest.json" "$zipdir/manifest.json"

          # READMEs: the templates in Firmware/release, filled in with envsubst. Only the named
          # variables are replaced, so any other "$" in a template stays as written.
          export VERSION TAG BOOTLOADER_NOTE
          export BOARD_TABLE="| \`gateway/\` | Gateway — RP2040 (USB side) + STM32F103C8 (cockpit side) | \`gateway-$VERSION.uf2\`, \`gateway-bridge-$VERSION-full.hex\`, \`gateway-bridge-$VERSION.elf\` |
          | \`pdu-left/\` | PDU Left — node 3 | \`pdu-left-$VERSION-full.hex\`, \`pdu-left-$VERSION.elf\` |
          | \`pdu-right/\` | PDU Right — node 4 | \`pdu-right-$VERSION-full.hex\`, \`pdu-right-$VERSION.elf\` |
          | \`pdu-center/\` | PDU Center — node 5 | \`pdu-center-$VERSION-full.hex\`, \`pdu-center-$VERSION.elf\` |"
          BOARD_TABLE="$(sed -E 's/^[[:space:]]+//' <<< "$BOARD_TABLE")"
          envsubst '$VERSION $TAG $BOARD_TABLE $BOOTLOADER_NOTE' < Firmware/release/README.md > "$zipdir/README.md"

          USB_FILE="gateway-$VERSION.uf2" COCKPIT_FILE="gateway-bridge-$VERSION.elf" \
            COCKPIT_FULL_FILE="gateway-bridge-$VERSION-full.hex" \
            envsubst '$VERSION $USB_FILE $COCKPIT_FILE $COCKPIT_FULL_FILE' \
            < Firmware/release/README-gateway.md > "$zipdir/gateway/README.md"

          pdu_notes="The PDU's calibration is stored on the board and survives a firmware update. A full chip erase removes it — recalibrate afterwards: https://openskyhawk.github.io/OpenSkyhawk/hardware/pdu/#bring-up-and-calibration"
          for p in "pdu-left|PDU Left|3" "pdu-right|PDU Right|4" "pdu-center|PDU Center|5"; do
            IFS='|' read -r folder title node <<< "$p"
            FILE="$folder-$VERSION.elf" FULL_FILE="$folder-$VERSION-full.hex" BOARD_TITLE="$title" \
              NODE_ID="$node" BOARD_NOTES="$pdu_notes" \
              envsubst '$VERSION $FILE $FULL_FILE $BOARD_TITLE $NODE_ID $BOARD_NOTES' \
              < Firmware/release/README-node.md > "$zipdir/$folder/README.md"
          done

          if [[ -n "$TAG" ]] && gh release view "$TAG" --json body -q .body > "$zipdir/CHANGES.md" 2>/dev/null; then
            :
          else
            echo "Validation build of $(git rev-parse --short HEAD) — no release notes." > "$zipdir/CHANGES.md"
          fi
          cp Firmware/LICENSE "$zipdir/LICENSE"

          (cd "$RUNNER_TEMP/zip" && zip -qr "$dist/$pkg.zip" "$pkg")

          {
            echo
            echo "## Files"
            echo
            echo '```'
            (cd "$dist" && ls -l)
            echo
            (cd "$RUNNER_TEMP/zip" && find "$pkg" -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: firmware-release-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist
          retention-days: 14
          if-no-files-found: error
