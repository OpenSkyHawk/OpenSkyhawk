# git-cliff configuration for the per-board sections of a hardware release's notes
# (design decision D10). The releases themselves go through release-please, like firmware
# (release-please-config.json); git-cliff only lists what changed in each board.
#
# tools/hardware-release/release_notes.py runs it once per board in a hardware release,
# over <the board's previous release (or release-please's bootstrap-sha)>..<the commit the
# boards were made from>, with --include-path "<board folder>/**". The script, not this
# template, adds the board's order ID, errata and version.
# Commit type picks the section; `!` (a pinout / harness / mounting / minimum-firmware
# break) lists the change under Breaking changes.

[changelog]
header = ""
body = """
{% if commits | length == 0 %}No changes to this board's design files.
{% else %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
  ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/OpenSkyHawk/OpenSkyhawk/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->⚠ Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^(refactor|perf)", group = "<!-- 3 -->Changes" },
  { message = ".*", skip = true },
]
