<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>DrumDisplay: one SSD1306 OLED wired to the J_I2C2 cable</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .mod   { fill:#111827; stroke:#9ca8bc; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .screen { fill:#020617; stroke:#3b8beb; stroke-width:1.5; }
    .digits { font-size:30px; font-weight:700; font-family:"SF Mono",Consolas,monospace; fill:#e8ecf4; letter-spacing:4px; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="248" rx="12"/>

  <!-- board, J_I2C2 -->
  <rect class="board" x="24" y="40" width="176" height="150" rx="6"/>
  <text class="title" x="112" y="30" text-anchor="middle">PanelGroup board</text>
  <text class="note"  x="38" y="182">J_I2C2 cable</text>
  <text class="pin tsig" x="182" y="75"  text-anchor="end">SDA</text>
  <text class="pin tsig" x="182" y="105" text-anchor="end">SCL</text>
  <text class="pin t33"  x="182" y="135" text-anchor="end">3.3V</text>
  <text class="pin tgnd" x="182" y="165" text-anchor="end">GND</text>
  <circle class="pad sig" cx="200" cy="70"  r="7"/>
  <circle class="pad sig" cx="200" cy="100" r="7"/>
  <circle class="pad v33" cx="200" cy="130" r="7"/>
  <circle class="pad gnd" cx="200" cy="160" r="7"/>

  <!-- wires -->
  <line class="w sig" x1="207" y1="70"  x2="393" y2="70"/>
  <line class="w sig" x1="207" y1="100" x2="393" y2="100"/>
  <line class="w v33" x1="207" y1="130" x2="393" y2="130"/>
  <line class="w gnd" x1="207" y1="160" x2="393" y2="160"/>

  <!-- OLED -->
  <rect class="mod" x="400" y="40" width="180" height="150" rx="6"/>
  <text class="title" x="490" y="30" text-anchor="middle">SSD1306 OLED, 128×32</text>
  <text class="pin tsig" x="414" y="75">SDA</text>
  <text class="pin tsig" x="414" y="105">SCL</text>
  <text class="pin t33"  x="414" y="135">VCC</text>
  <text class="pin tgnd" x="414" y="165">GND</text>
  <circle class="pad sig" cx="400" cy="70"  r="7"/>
  <circle class="pad sig" cx="400" cy="100" r="7"/>
  <circle class="pad v33" cx="400" cy="130" r="7"/>
  <circle class="pad gnd" cx="400" cy="160" r="7"/>
  <rect class="screen" x="460" y="88" width="108" height="44" rx="3"/>
  <text class="digits" x="514" y="121" text-anchor="middle">250</text>

  <text class="note" x="300" y="226" text-anchor="middle">A lone screen goes on J_I2C2, so J_I2C1 stays free for a mux and expanders</text>
</svg>
