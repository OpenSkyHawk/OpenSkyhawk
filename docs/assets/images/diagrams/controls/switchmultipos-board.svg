<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>SwitchMultiPos: a 4-position selector wired to pins PA0 to PA3 on the PanelGroup board</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .res { fill:#1e293b; stroke:#c7d0e0; stroke-width:2; }
    .dot { fill:#7db4f5; }
    .sw  { fill:none; stroke:#e8ecf4; stroke-width:2.5; stroke-linecap:round; }
    .swc { fill:#0d1626; stroke:#e8ecf4; stroke-width:2; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="318" rx="12"/>

  <!-- board -->
  <rect class="board" x="24" y="40" width="176" height="248" rx="6"/>
  <text class="title" x="112" y="30" text-anchor="middle">PanelGroup board</text>
  <text class="pin t33"  x="182" y="67"  text-anchor="end">3.3V</text>
  <text class="pin tsig" x="182" y="110" text-anchor="end">PA0</text>
  <text class="pin tsig" x="182" y="150" text-anchor="end">PA1</text>
  <text class="pin tsig" x="182" y="190" text-anchor="end">PA2</text>
  <text class="pin tsig" x="182" y="230" text-anchor="end">PA3</text>
  <text class="pin tgnd" x="182" y="273" text-anchor="end">GND</text>
  <circle class="pad v33" cx="200" cy="62"  r="7"/>
  <circle class="pad sig" cx="200" cy="105" r="7"/>
  <circle class="pad sig" cx="200" cy="145" r="7"/>
  <circle class="pad sig" cx="200" cy="185" r="7"/>
  <circle class="pad sig" cx="200" cy="225" r="7"/>
  <circle class="pad gnd" cx="200" cy="268" r="7"/>

  <!-- 3.3V rail → one pull-up resistor per pin -->
  <polyline class="w v33" points="207,62 430,62"/>
  <line class="w v33" x1="280" y1="62" x2="280" y2="68"/>
  <line class="w v33" x1="330" y1="62" x2="330" y2="68"/>
  <line class="w v33" x1="380" y1="62" x2="380" y2="68"/>
  <line class="w v33" x1="430" y1="62" x2="430" y2="68"/>
  <rect class="res" x="270" y="68" width="20" height="24" rx="3"/>
  <rect class="res" x="320" y="68" width="20" height="24" rx="3"/>
  <rect class="res" x="370" y="68" width="20" height="24" rx="3"/>
  <rect class="res" x="420" y="68" width="20" height="24" rx="3"/>
  <line class="w sig" x1="280" y1="92" x2="280" y2="105"/>
  <line class="w sig" x1="330" y1="92" x2="330" y2="145"/>
  <line class="w sig" x1="380" y1="92" x2="380" y2="185"/>
  <line class="w sig" x1="430" y1="92" x2="430" y2="225"/>
  <text class="label" x="355" y="50" text-anchor="middle">10 kΩ pull-up on every pin</text>

  <!-- pin wires to the selector's position legs (hopping over the pull-up wires) -->
  <path class="w sig" d="M207,105 H324 a6,6 0 0 1 12,0 H374 a6,6 0 0 1 12,0 H424 a6,6 0 0 1 12,0 H494"/>
  <path class="w sig" d="M207,145 H374 a6,6 0 0 1 12,0 H424 a6,6 0 0 1 12,0 H494"/>
  <path class="w sig" d="M207,185 H424 a6,6 0 0 1 12,0 H494"/>
  <line class="w sig" x1="207" y1="225" x2="494" y2="225"/>
  <circle class="dot" cx="280" cy="105" r="4.5"/>
  <circle class="dot" cx="330" cy="145" r="4.5"/>
  <circle class="dot" cx="380" cy="185" r="4.5"/>
  <circle class="dot" cx="430" cy="225" r="4.5"/>

  <!-- selector: four position legs and the common leg -->
  <circle class="swc" cx="498" cy="105" r="4"/>
  <circle class="swc" cx="498" cy="145" r="4"/>
  <circle class="swc" cx="498" cy="185" r="4"/>
  <circle class="swc" cx="498" cy="225" r="4"/>
  <text class="label" x="486" y="97" text-anchor="end">0</text>
  <text class="label" x="486" y="137" text-anchor="end">1</text>
  <text class="label" x="486" y="177" text-anchor="end">2</text>
  <text class="label" x="486" y="217" text-anchor="end">3</text>
  <circle class="swc" cx="550" cy="165" r="5"/>
  <line class="sw" x1="546" y1="162" x2="503" y2="147"/>
  <text class="note"  x="550" y="187" text-anchor="middle">common</text>
  <text class="label" x="528" y="252" text-anchor="middle">rotary selector</text>

  <!-- common → GND -->
  <polyline class="w gnd" points="555,165 578,165 578,268 207,268"/>

  <text class="note" x="300" y="304" text-anchor="middle">The knob connects one leg at a time to GND · shown here in position 1</text>
</svg>
