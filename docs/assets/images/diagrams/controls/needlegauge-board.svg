<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>NeedleGauge wired from board pins PA0 to PA3 through a DRV8833 module to an X27.589 motor</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .mod   { fill:#111827; stroke:#9ca8bc; stroke-width:2; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .v5  { stroke:#f59e0b; } .t5   { fill:#fbbf24; }
    .coil { stroke:#c084fc; } .tcoil { fill:#d8b4fe; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .dot5 { fill:#fbbf24; } .dotg { fill:#9ca8bc; }
    .dial   { fill:#0a0e1a; stroke:#c7d0e0; stroke-width:2; }
    .needle { stroke:#f8fafc; stroke-width:3; stroke-linecap:round; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="318" rx="12"/>

  <!-- board -->
  <rect class="board" x="20" y="44" width="130" height="186" rx="6"/>
  <text class="title" x="85" y="34" text-anchor="middle">PanelGroup board</text>
  <text class="pin tsig" x="136" y="75"  text-anchor="end">PA0</text>
  <text class="pin tsig" x="136" y="105" text-anchor="end">PA1</text>
  <text class="pin tsig" x="136" y="135" text-anchor="end">PA2</text>
  <text class="pin tsig" x="136" y="165" text-anchor="end">PA3</text>
  <text class="pin tgnd" x="136" y="205" text-anchor="end">GND</text>
  <circle class="pad sig" cx="150" cy="70"  r="7"/>
  <circle class="pad sig" cx="150" cy="100" r="7"/>
  <circle class="pad sig" cx="150" cy="130" r="7"/>
  <circle class="pad sig" cx="150" cy="160" r="7"/>
  <circle class="pad gnd" cx="150" cy="200" r="7"/>

  <!-- DRV8833 module -->
  <rect class="mod" x="232" y="44" width="128" height="212" rx="6"/>
  <text class="title" x="296" y="34" text-anchor="middle">DRV8833 module</text>
  <text class="pin tsig" x="246" y="75">IN1</text>
  <text class="pin tsig" x="246" y="105">IN2</text>
  <text class="pin tsig" x="246" y="135">IN3</text>
  <text class="pin tsig" x="246" y="165">IN4</text>
  <text class="pin tgnd" x="246" y="205">GND</text>
  <circle class="pad sig" cx="232" cy="70"  r="7"/>
  <circle class="pad sig" cx="232" cy="100" r="7"/>
  <circle class="pad sig" cx="232" cy="130" r="7"/>
  <circle class="pad sig" cx="232" cy="160" r="7"/>
  <circle class="pad gnd" cx="232" cy="200" r="7"/>
  <text class="pin tcoil" x="346" y="75"  text-anchor="end">OUT1</text>
  <text class="pin tcoil" x="346" y="105" text-anchor="end">OUT2</text>
  <text class="pin tcoil" x="346" y="135" text-anchor="end">OUT3</text>
  <text class="pin tcoil" x="346" y="165" text-anchor="end">OUT4</text>
  <text class="pin t5"    x="346" y="205" text-anchor="end">VCC</text>
  <text class="pin t5"    x="346" y="241" text-anchor="end">EEP</text>
  <circle class="pad coil" cx="360" cy="70"  r="7"/>
  <circle class="pad coil" cx="360" cy="100" r="7"/>
  <circle class="pad coil" cx="360" cy="130" r="7"/>
  <circle class="pad coil" cx="360" cy="160" r="7"/>
  <circle class="pad v5"   cx="360" cy="200" r="7"/>
  <circle class="pad v5"   cx="360" cy="236" r="7"/>

  <!-- board pins → driver inputs -->
  <line class="w sig" x1="157" y1="70"  x2="225" y2="70"/>
  <line class="w sig" x1="157" y1="100" x2="225" y2="100"/>
  <line class="w sig" x1="157" y1="130" x2="225" y2="130"/>
  <line class="w sig" x1="157" y1="160" x2="225" y2="160"/>
  <line class="w gnd" x1="157" y1="200" x2="225" y2="200"/>

  <!-- motor -->
  <rect class="mod" x="452" y="44" width="128" height="136" rx="6"/>
  <text class="title" x="516" y="34" text-anchor="middle">X27.589 motor</text>
  <text class="pin tcoil" x="466" y="75">1</text>
  <text class="pin tcoil" x="466" y="105">2</text>
  <text class="pin tcoil" x="466" y="135">3</text>
  <text class="pin tcoil" x="466" y="165">4</text>
  <circle class="pad coil" cx="452" cy="70"  r="7"/>
  <circle class="pad coil" cx="452" cy="100" r="7"/>
  <circle class="pad coil" cx="452" cy="130" r="7"/>
  <circle class="pad coil" cx="452" cy="160" r="7"/>
  <circle class="dial" cx="532" cy="112" r="32"/>
  <line class="needle" x1="532" y1="112" x2="550" y2="86"/>
  <circle cx="532" cy="112" r="4" fill="#f8fafc"/>

  <!-- driver outputs → motor pins -->
  <line class="w coil" x1="367" y1="70"  x2="445" y2="70"/>
  <line class="w coil" x1="367" y1="100" x2="445" y2="100"/>
  <line class="w coil" x1="367" y1="130" x2="445" y2="130"/>
  <line class="w coil" x1="367" y1="160" x2="445" y2="160"/>

  <!-- 5 V supply → VCC, with the EEP → VCC jumper -->
  <line class="w v5" x1="367" y1="200" x2="470" y2="200"/>
  <circle class="pad v5" cx="477" cy="200" r="7"/>
  <text class="pin t5" x="492" y="205">5 V</text>
  <polyline class="w v5" points="367,236 400,236 400,200"/>
  <circle class="dot5" cx="400" cy="200" r="4.5"/>
  <text class="note" x="372" y="266">jumper EEP → VCC</text>

  <!-- supply GND joins the shared ground -->
  <polyline class="w gnd" points="470,284 190,284 190,200"/>
  <circle class="dotg" cx="190" cy="200" r="4.5"/>
  <circle class="pad gnd" cx="477" cy="284" r="7"/>
  <text class="pin tgnd" x="492" y="289">GND</text>
  <text class="title" x="492" y="246">5 V supply</text>

  <text class="note" x="300" y="310" text-anchor="middle">VCC on 5 V only, never 12 V · every GND joined together</text>
</svg>
