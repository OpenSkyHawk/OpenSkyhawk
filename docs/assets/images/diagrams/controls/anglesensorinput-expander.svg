<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family='"Saira", "Saira Variable", ui-sans-serif, system-ui, sans-serif'>
  <title>AngleSensorInput: an AS5600 sensor board wired to input A0 on an analog expander</title>
  <style>
    .card  { fill:#0d1626; stroke:rgba(59,139,235,0.22); stroke-width:1.5; }
    .board { fill:#111827; stroke:#3b8beb; stroke-width:2; }
    .mod   { fill:#111827; stroke:#c7d0e0; stroke-width:2; }
    .chip  { fill:#1e293b; stroke:#c7d0e0; stroke-width:1.5; }
    .mag   { fill:none; stroke:#e8ecf4; stroke-width:2; stroke-dasharray:5 4; }
    .title { font-size:13px; font-weight:700; fill:#e8ecf4; }
    .pin   { font-size:13px; font-weight:700; font-family:"SF Mono",Consolas,monospace; }
    .mpin  { font-size:12px; font-weight:700; font-family:"SF Mono",Consolas,monospace; fill:#c7d0e0; }
    .label { font-size:12.5px; fill:#c7d0e0; }
    .note  { font-size:11.5px; fill:#9ca8bc; font-style:italic; }
    .w     { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .v33 { stroke:#4ade80; } .t33 { fill:#4ade80; }
    .gnd { stroke:#64748b; } .tgnd { fill:#9ca8bc; }
    .sig { stroke:#3b8beb; } .tsig { fill:#7db4f5; }
    .pad { fill:#0a0e1a; stroke-width:2.5; }
    .gdot { fill:#64748b; }
  </style>
  <rect class="card" x="1" y="1" width="598" height="248" rx="12"/>

  <!-- board / expander -->
  <rect class="board" x="24" y="40" width="176" height="160" rx="6"/>
  <text class="title" x="112" y="30" text-anchor="middle">Analog expander</text>
  <text class="note"  x="38" y="190">ADS1115 · cable to J_I2C1</text>
  <text class="pin t33"  x="182" y="75"  text-anchor="end">3.3V</text>
  <text class="pin tsig" x="182" y="125" text-anchor="end">A0</text>
  <text class="pin tgnd" x="182" y="175" text-anchor="end">GND</text>
  <circle class="pad v33" cx="200" cy="70"  r="7"/>
  <circle class="pad sig" cx="200" cy="120" r="7"/>
  <circle class="pad gnd" cx="200" cy="170" r="7"/>

  <!-- AS5600 sensor board -->
  <rect class="mod" x="390" y="40" width="176" height="160" rx="6"/>
  <text class="title" x="478" y="30" text-anchor="middle">AS5600 sensor board</text>
  <circle class="pad v33" cx="390" cy="70"  r="7"/>
  <circle class="pad sig" cx="390" cy="120" r="7"/>
  <circle class="pad gnd" cx="390" cy="145" r="7"/>
  <circle class="pad gnd" cx="390" cy="170" r="7"/>
  <text class="mpin" x="406" y="74">VCC</text>
  <text class="mpin" x="406" y="124">OUT</text>
  <text class="mpin" x="406" y="149">DIR</text>
  <text class="mpin" x="406" y="174">GND</text>

  <!-- chip with the magnet above it -->
  <rect class="chip" x="498" y="108" width="24" height="24" rx="2"/>
  <circle class="mag" cx="510" cy="120" r="30"/>
  <text class="note" x="510" y="70" text-anchor="middle">magnet</text>
  <text class="note" x="510" y="84" text-anchor="middle">above chip</text>

  <!-- wires -->
  <line class="w v33" x1="207" y1="70"  x2="383" y2="70"/>
  <line class="w sig" x1="207" y1="120" x2="383" y2="120"/>
  <line class="w gnd" x1="207" y1="170" x2="383" y2="170"/>
  <!-- DIR → GND -->
  <polyline class="w gnd" points="383,145 360,145 360,170"/>
  <circle class="gdot" cx="360" cy="170" r="4.5"/>

  <text class="note" x="300" y="228" text-anchor="middle">Same wiring as on the board, just on the expander&#8217;s input</text>
</svg>
